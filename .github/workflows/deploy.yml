# Deploy the static Astro build to GitHub Pages.
# Prereqs (one-time, repo Settings): Pages → Source = "GitHub Actions",
# and the custom domain set to commercial.obsidixz.pp.ua.
# Repo must be PUBLIC (free plan) — see DEPLOYMENT.md.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena/5a9708cf-obsidixz-commercial
      - main
    paths-ignore:
      - '**/*.md'
      - 'verification/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check
      - run: npm run build
      - run: npm run verify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
